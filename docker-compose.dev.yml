services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"      # снаружи Docker видно только nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf   # ⚠️ без этой строки твой proxy_pass не применится
    depends_on:
      - backend


  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db   # данные переживают перезапуск контейнера (путь обязательный!)
    ports:
      - "27017:27017"

volumes:
  mongo_data: